<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BulkDirect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0f172a; 
      color: white; 
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
      background: #1e293b;
      padding: 40px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    h1 { font-size: 48px; margin-bottom: 20px; }
    .cyan { color: #22d3ee; }
    p { color: #94a3b8; font-size: 18px; margin: 15px 0; }
    .checks { margin: 30px 0; font-size: 14px; }
    .check { margin: 10px 0; }
    footer { margin-top: 40px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>BULK<span class="cyan">DIRECT</span></h1>
    <p>B2B Marketplace + Reddit Intelligence</p>
    
    <div class="checks">
      <div class="check">✅ Supabase Connected</div>
      <div class="check">✅ Variables Set</div>
      <div class="check">✅ Ready for Development</div>
    </div>
    
    <p style="margin-top: 30px; color: #22d3ee;">🚀 Coming Soon</p>
    
    <footer>
      <p>Built with ❤️ by Tarik</p>
      <p>@iaproductbuilder</p>
    </footer>
  </div>
</body>
</html>
